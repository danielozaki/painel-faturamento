<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Faturamento B2B · Hotelaria</title>
<style>
:root{--canvas:#E8E6E2;--card:#FFFFFF;--line:#D8D3CC;--ink:#2E2D2A;--ink2:#5D5A54;--ink3:#8A857D;
  --brand:#33322F;--accent:#8C7A5B;--band:#3A2F48;--band2:#544766;--bandTx:#D9D0E2;--late:#A6503C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--canvas);color:var(--ink);font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh}
header{background:var(--brand);border-bottom:3px solid var(--accent);padding:14px max(16px,env(safe-area-inset-left,0px))}
header img{height:30px;width:auto;display:block}
main{flex:1;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);overflow:hidden}
.band{background:linear-gradient(90deg,var(--band),var(--band2));color:var(--bandTx);padding:12px 20px;
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
form{padding:22px 20px 20px;display:grid;gap:14px}
h1{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
p{margin:0;color:var(--ink2)}
label{display:grid;gap:6px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
input[type=password]{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:#fff;width:100%}
input[type=password]:focus{outline:2px solid var(--band2);outline-offset:0;border-color:var(--band2)}
.lembrar{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink2)}
button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:4px;background:var(--band);color:#fff;cursor:pointer}
button:hover{background:var(--band2)}
button[disabled]{opacity:.6;cursor:wait}
.erro{color:var(--late);font-weight:600;min-height:1.2em}
.rod{font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding:10px 20px}
</style>
</head>
